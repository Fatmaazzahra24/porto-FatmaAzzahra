server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTTPS on this application's domain transports an HMAC-signed push event.
    # Coolify verifies the application-specific secret, repository, and branch.
    # This endpoint never receives a general Coolify API token.
    location = /__deploy/github {
        if ($request_method != POST) { return 405; }
        if ($http_x_github_event != push) { return 400; }
        if ($http_x_hub_signature_256 !~ "^sha256=[a-f0-9]{64}$") { return 403; }
        client_max_body_size 1m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://coolify:8080/webhooks/source/github/events/manual;
    }

    location ~ /\. { deny all; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
